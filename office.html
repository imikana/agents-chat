<title>Офис команды Инны</title>

<style>
  :root { --bg:#2b211c; --card:#3a2d26; --text:#fbf1e6; --muted:#c9b4a2; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 4px 0 10px; font-weight: 650; }
  #stage { width:100%; display:block; border-radius:16px; background:#e9d3b6; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .chips { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
  .chip { display:flex; align-items:center; gap:8px; background:var(--card); border-radius:12px; padding:8px 10px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .chip b { font-weight:600; } .chip span { color:var(--muted); }
  h2 { font-size:14px; color:var(--muted); font-weight:600; margin:16px 0 6px; }
  .log { display:flex; flex-direction:column; gap:8px; }
  .msg { background:var(--card); border-radius:12px; padding:8px 10px; border-left:4px solid #888; word-wrap:break-word; }
  .msg small { display:block; color:var(--muted); margin-bottom:2px; }
  #note { color:var(--muted); text-align:center; padding:24px 0; }
</style>

  drawOverlay(now);

}

// ---------------------------------------------------------------- данные
const chipsEl = document.getElementById("chips"), logEl = document.getElementById("log"), noteEl = document.getElementById("note");
function renderChips() {
  chipsEl.innerHTML = "";
  Object.values(agents).forEach((a) => {
    const c = COLORS[a.key], d = document.createElement("div"); d.className = "chip";
    const label = a.moving ? (a.pending && a.pending.act === "work" ? "бежит к столу" : LABELS.walk) : (a.act === "gather" && huddle.until ? "болтает с командой" : (LABELS[a.act] || ""));
    d.innerHTML = `<i class="dot" style="background:${c.color}"></i><b>${c.name}</b><span>${label}</span>`;
    chipsEl.appendChild(d);
  });
}
function renderLog(feed) {
  logEl.innerHTML = "";
  feed.slice().reverse().slice(0, 8).forEach((m) => {
    const color = m.who === "inna" ? INNA_COLOR : (COLORS[m.who] || {}).color || "#888";
    const nm = m.who === "inna" ? "Инна" : (COLORS[m.who] || {}).name || m.who;
    const d = document.createElement("div"); d.className = "msg"; d.style.borderLeftColor = color;
    const small = document.createElement("small"); small.textContent = nm; const t = document.createElement("div"); t.textContent = m.text;
    d.append(small, t); logEl.appendChild(d);
  });
}
function applyState(st) {
  status = Object.assign({ scout: "idle", chief: "idle", stats: "idle" }, st.status || {});
  const feed = st.feed || [], now = performance.now();
  feed.forEach((m) => {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    if (firstLoad) return;
    lastMsgAt = now;
    if (m.who === "inna") { banner = { text: m.text.slice(0, 140), until: now + 8000 }; return; }
    const a = agents[m.who];
    if (a) { a.bubble = { text: m.text.slice(0, 110), until: now + 10000 }; a.talkUntil = now + Math.min(6000, 1200 + m.text.length * 40); }
  });
  firstLoad = false;
  renderLog(feed);
}
async function poll() {
  try {
    const r = await fetch("state", { headers: { "X-Init-Data": initData }, cache: "no-store" });
    if (r.status === 403) { noteEl.hidden = false; noteEl.textContent = "Откройте офис кнопкой в личном чате с ботом «Главный» (доступ только у Инны)."; return; }
    if (r.ok) { noteEl.hidden = true; applyState(await r.json()); }
  } catch (e) {}
}
// демо без Telegram: ?demo=1 (выдуманные реплики, только чтобы посмотреть картинку)
function demoLoop() {
  const lines = [
    ["inna", "Что снимаем завтра?"], ["scout", "Есть тренд про утро с малышом, снимается за 20 минут."],
    ["chief", "Берём, добавим короткую ИИ-вставку про нашего бота."], ["stats", "Похожий ролик набрал больше сохранений."],
    ["chief", "Инна, ок снимать завтра на кухне?"],
  ];
  let i = 0, id = 1; const feed = [];
  const step = () => {
    const [who, text] = lines[i % lines.length]; i++;
    if (who !== "inna") { status[who] = "thinking"; setTimeout(() => { status[who] = "idle"; }, 2500); }
    setTimeout(() => { feed.push({ id: id++, who, text }); applyState({ status, feed: feed.slice(-12) }); }, who === "inna" ? 0 : 2600);
    setTimeout(step, who === "inna" ? 4000 : 9000);
  };
  applyState({ status, feed: [] });
  setTimeout(step, params.get("start") ? Number(params.get("start")) : 2500);
}

requestAnimationFrame(frame);
setInterval(renderChips, 700); renderChips();
if (DEMO) demoLoop(); else { poll(); setInterval(poll, 2000); }
</script>
